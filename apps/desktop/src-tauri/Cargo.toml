[package]
name = "yingmu-desktop"
version = "0.3.2"
description = "影幕 YingMu — Tauri 2 桌面端壳（Windows x64 首发）"
edition = "2021"
rust-version = "1.89"
publish = false

# Tauri 2 模板惯例：同时产出 lib（供 main.rs 调用）与 cdylib/staticlib（供移动端/嵌入）。
[lib]
name = "yingmu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 不启用任何 tauri 插件：本应用通过自定义 command 访问核心，capabilities 保持最小。
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
# scan.rs 在写入 MediaVersion.modified_at 时使用 chrono::Utc；
# workspace 根清单虽已声明，但每个 crate 仍须各自显式引用。
chrono = { workspace = true }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
yingmu-core = { path = "../../../crates/yingmu-core" }
