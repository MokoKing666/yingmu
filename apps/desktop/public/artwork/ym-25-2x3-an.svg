<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="动画云海列车">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2b21"/><stop offset="1" stop-color="#34563d"/></linearGradient>
<radialGradient id="sun" cx="0.7" cy="0.2" r="0.66"><stop offset="0" stop-color="#679461" stop-opacity="0.88"/><stop offset="0.34" stop-color="#679461" stop-opacity="0.3"/><stop offset="1" stop-color="#679461" stop-opacity="0"/></radialGradient>
<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34563d"/><stop offset="1" stop-color="#0f1c14"/></linearGradient>
<linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1"><stop offset="0.58" stop-color="#0b180f" stop-opacity="0"/><stop offset="1" stop-color="#0b180f" stop-opacity="0.34"/></linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.44" r="0.8"><stop offset="0.55" stop-color="#0b180f" stop-opacity="0"/><stop offset="1" stop-color="#0b180f" stop-opacity="0.2"/></radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.8"/></filter>
<filter id="softLg" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="1" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
</defs>
