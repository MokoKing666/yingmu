<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 600" width="750" height="600" role="img" aria-label="静物·咖啡馆窗景">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c241a"/><stop offset="1" stop-color="#635432"/></linearGradient>
<radialGradient id="sun" cx="0.5" cy="0.2" r="0.66"><stop offset="0" stop-color="#c3ad69" stop-opacity="0.88"/><stop offset="0.34" stop-color="#c3ad69" stop-opacity="0.3"/><stop offset="1" stop-color="#c3ad69" stop-opacity="0"/></radialGradient>
<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#635432"/><stop offset="1" stop-color="#1b160d"/></linearGradient>
