name: Release

# 仅由版本标签触发（v*），例如 v0.1.0。
on:
  push:
    tags: ['v*']

# 创建 Release 需要写权限；其他 job 不共享此权限。
permissions:
  contents: write

# Release 不允许被并发取消，避免同一 tag 的构建被中断产生半成品。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 安全约定：
# - 只允许上传「本工作流内刚构建、并通过 scripts/verify-release.mjs 校验」的
#   NSIS 安装包与 SHA256SUMS.txt；严禁引用外部 / 历史 / 未校验的产物。
# - 项目处于 v0.1.0 早期阶段，不得把未完成或未实机验证的功能标注为正式支持；
#   该声明会一并写入 Release notes。
# - 本工作流从未在本机执行过（本机受构建环境限制未产出安装包，GitHub Actions job
#   无法在本机运行）。本次 NSIS 产物命名规范化为静态修补，未在 GitHub runner 实跑验证。

jobs:
  release:
    name: 构建并发布 Windows x64 安装包
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 取完整历史，便于将来按 tag 生成提交摘要 / 读取 CHANGELOG。
          fetch-depth: 0
      - name: 配置 Node.js 22 (含 npm 缓存)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: 配置 Rust stable (MSVC 工具链)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: 安装依赖 (npm ci)
        run: npm ci
      - name: 构建前端产物 (build)
        run: npm run build
      # 省略 tagName / releaseName / releaseId：tauri-action 只执行构建，不创建
      # Release、也不上传资产。Release 统一由下方 softprops 步骤创建并上传，
      # 保证上传的是本工作流内刚构建且已校验的产物。
      # 使用 @v1：与 Tauri v2 官方 GitHub Actions 工作流示例一致（team-lead 已确认）。
      - name: 构建 NSIS 安装包 (tauri-action)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          args: --bundles nsis
      # tauri-action 产出的 NSIS 文件名由 tauri.conf.json 的 productName + version
      # 推导（例如「影幕 YingMu_0.1.0_x64-setup.exe」），落在 .../bundle/nsis/ 下，
      # 永远不会叫 YingMu-Setup-*.exe。因此构建后必须显式定位真实产物并规范化命名：
      #  - 用 */bundle/nsis/*.exe 同时兼容「项目内 target」与「工作区根 target」布局；
      #  - version 由 tag（github.ref_name）去掉前导 v 推导（v0.1.0 → 0.1.0）；
      #  - 复制到独立暂存目录 nsis-staging/，下一步只对它做校验，校验通过后再
      #    复制到 release-assets/ 供上传。暂存目录刻意不放在 release-assets/
      #    或 installer-artifact/ 下，避免被定位 find 的排除规则过滤掉。
      - name: 规范化安装包文件名 (定位真实 NSIS 产物并重命名)
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find . -type f -path '*/bundle/nsis/*.exe' \
            -not -path './node_modules/*' \
            -print -quit)"
          if [ -z "$exe" ]; then
            echo "::error::tauri-action 未产出任何 NSIS 安装包（*/bundle/nsis/*.exe 未找到）"
            exit 1
          fi
          version="${{ github.ref_name }}"
          version="${version#v}"
          version="${version#V}"
          if [ -z "$version" ]; then
            echo "::error::无法从 tag（${{ github.ref_name }}）推导版本号"
            exit 1
          fi
          mkdir -p nsis-staging
          cp "$exe" "nsis-staging/YingMu-Setup-${version}-x64.exe"
          echo "规范化产物: $exe -> nsis-staging/YingMu-Setup-${version}-x64.exe"
      # 先定位、再真实校验（存在 / >1MB / PE(MZ) / SHA-256），失败即非零退出。
      - name: 定位并校验安装包 (存在且非空 / PE / SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          # 只对暂存目录做 find：暂存产物不在 release-assets/ / installer-artifact/ 下，
          # 因此不会被排除规则过滤，也不会误命中历史遗留产物。
          src="$(find nsis-staging -type f -name 'YingMu-Setup-*.exe' -print -quit)"
          if [ -z "$src" ]; then
            echo "::error::未找到 nsis-staging/YingMu-Setup-*.exe —— 构建未产出 NSIS 安装包"
            exit 1
          fi
          echo "找到安装包: $src"
          mkdir -p release-assets
          cp "$src" release-assets/
          exe="release-assets/$(basename "$src")"
          node scripts/verify-release.mjs "$exe" --sums release-assets/SHA256SUMS.txt
      # 软换行提取 CHANGELOG 对应版本段落：
      # Markdown 段落内的单个换行是「软换行」(soft line break)，渲染时合并为空格；
      # 这里把普通文本行的软换行规范化为空格，列表 / 引用 / 代码块保持独立行，
      # 以免破坏 Markdown 结构。找不到 CHANGELOG 或对应版本时降级为占位说明，
      # 不使发布失败。
      - name: 提取 CHANGELOG 对应版本段落
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const tag = process.env.TAG || '';
          const version = tag.replace(/^v/i, '');
          const candidates = ['CHANGELOG.md', 'docs/CHANGELOG.md'];
          const file = candidates.find((f) => fs.existsSync(f));
          let body = '';
          let source = '';

          if (file) {
            const text = fs.readFileSync(file, 'utf8').replace(/\r\n/g, '\n');
            const lines = text.split('\n');
            const esc = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const head = new RegExp('^##\\s+\\[?[vV]?' + esc + '\\]?(?:\\s|$)', 'i');
            const start = lines.findIndex((l) => head.test(l));
            if (start >= 0) {
              const section = [];
              for (let i = start + 1; i < lines.length; i++) {
                if (/^##\s/.test(lines[i])) break;
                section.push(lines[i]);
              }
              // 软换行规范化：普通文本相邻行合并为空格；列表 / 引用 / 标题 /
              // 代码围栏保持独立行；空行作为段落分隔。
              const out = [];
              let para = [];
              const flush = () => {
                if (para.length) { out.push(para.join(' ')); para = []; }
              };
              for (const line of section) {
                const t = line.trim();
                if (t === '') { flush(); out.push(''); continue; }
                if (/^(?:[-*+]\s|\d+\.\s|>|#{1,6}\s|```|~~~)/.test(t)) {
                  flush();
                  out.push(line);
                } else {
                  para.push(t);
                }
              }
              flush();
              body = out.join('\n').trim();
              source = file + ' 中 ' + tag + ' 段落';
            }
          }

          if (!body) {
            body = [
              '影幕 YingMu ' + tag,
              '',
              '> 本版本变更说明未收录于 CHANGELOG.md，请以提交历史为准。',
            ].join('\n');
            source = '内置占位说明（未找到 CHANGELOG 或对应版本段落）';
          }

          body += [
            '',
            '---',
            '说明：影幕 YingMu 处于 v0.1.0 早期阶段，未完成或未实机验证的功能一律不标注为正式支持。',
            '本 Release 仅包含上面列出的、已构建并通过校验的 Windows x64 NSIS 安装包。',
          ].join('\n');

          fs.writeFileSync('release-notes.md', body + '\n');
          process.stdout.write('Release notes 来源: ' + source + '\n');
          NODE
      # 只允许上传本工作流内刚构建、并已通过上一步校验的产物。
      - name: 创建 GitHub Release 并上传安装包与校验和
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 影幕 YingMu ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/YingMu-Setup-*.exe
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
