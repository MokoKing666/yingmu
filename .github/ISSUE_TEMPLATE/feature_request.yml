name: 功能建议 / Feature Request
description: 提出影幕 YingMu 的功能想法或改进建议
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请说明使用场景与动机，而不是只给出解决方案。

        - 请不要在建议中粘贴密钥、凭据、本机绝对路径或私人媒体文件。
        - 影幕 YingMu 处于 v0.1.0 早期阶段：被采纳的建议会进入待办列表，但在实现并实机验证之前，**不会**被标注为正式支持的功能。
        - 涉及 HDR、Dolby、音频直通等能力时，请改用「播放兼容性实机验证」表单提交观测数据。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / 使用场景
      description: 描述你在整理、浏览或播放媒体时遇到的真实困扰
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 描述你希望的行为、交互或结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 媒体库 / 扫描 / 元数据
        - 磁贴幕墙 / 界面 / 设计系统
        - 播放 / 字幕 / 音轨
        - 设置 / 诊断
        - 安装 / 更新 / 打包
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issue 与讨论，确认不是重复建议
          required: true
        - label: 我理解建议被采纳不等于该功能已正式支持
          required: true
